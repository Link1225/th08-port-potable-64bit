name: TH08BringUp
options:
  bundleIdPrefix: jp.th08
  deploymentTarget:
    iOS: "15.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: "TH08 Bring-up"
    INFOPLIST_KEY_UIFileSharingEnabled: YES
    INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: NO
targets:
  TH08BringUp:
    type: application
    platform: iOS
    sources:
      - path: TH08BringUp
      - path: Renderer
    dependencies:
      - sdk: OpenGLES.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.th08.bringup
        PRODUCT_NAME: TH08BringUp
        SWIFT_EMIT_LOC_STRINGS: YES
        SWIFT_OBJC_BRIDGING_HEADER: TH08BringUp/TH08BringUp-Bridging-Header.h
  TH08BringUpTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: TH08BringUp
      - sdk: XCTest.framework
      - sdk: OpenGLES.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.th08.bringup.tests
        PRODUCT_NAME: TH08BringUpTests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  TH08BringUp:
    build:
      targets:
        TH08BringUp: all
        TH08BringUpTests: [test]
    test:
      targets:
        - TH08BringUpTests
