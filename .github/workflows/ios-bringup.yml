name: iOS bring-up

concurrency:
  # Give each run its own group: GitHub otherwise replaces an older pending run
  # even when cancel-in-progress is false.
  group: ios-bring-up-${{ github.run_id }}
  cancel-in-progress: false

on:
  workflow_dispatch:
  push:
    branches:
      - port/portable-64bit
    paths:
      - "ios/BringUp/**"
      - "ios/Engine/**"
      - "src/**"
      - "config/i18n.csv"
      - "scripts/generate_i18n.py"
      - "ios/Tests/**"
      - "ios/README.md"
      - "ios/RENDERER_PORT.md"
      - "src/Global.cpp"
      - "src/Supervisor.cpp"
      - ".github/workflows/ios-bringup.yml"

jobs:
  pbg-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test PBG archive parser
        run: |
          swiftc ios/BringUp/TH08BringUp/TH08DataArchiveImport.swift ios/Tests/PBGArchiveImportTests.swift -o /tmp/th08-pbg-import-tests
          /tmp/th08-pbg-import-tests
          swiftc ios/BringUp/TH08BringUp/TH08IOSKeyboardKeyMapping.swift ios/Tests/KeyboardMappingTests.swift -o /tmp/th08-ios-key-mapping-tests
          /tmp/th08-ios-key-mapping-tests
          c++ -std=c++98 -Iios/Engine ios/Engine/TH08IOSFileHandle.cpp ios/Tests/TH08IOSFileHandleTests.cpp -o /tmp/th08-ios-file-handle-tests
          /tmp/th08-ios-file-handle-tests
          c++ -std=c++98 -pthread -Isrc/modern/linux/include ios/Engine/TH08IOSPlatformPrimitives.cpp ios/Tests/TH08IOSPlatformPrimitivesTests.cpp -o /tmp/th08-ios-platform-primitives-tests
          /tmp/th08-ios-platform-primitives-tests

  simulator-build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Test keyboard state bridge
        run: |
          clang++ -std=c++17 -x objective-c++ ios/BringUp/TH08BringUp/TH08IOSKeyboard.mm ios/Tests/KeyboardBridgeTests.cpp -o /tmp/th08-ios-keyboard-tests
          /tmp/th08-ios-keyboard-tests
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        working-directory: ios/BringUp
        run: xcodegen generate
      - name: Build iOS Simulator app
        run: |
          xcodebuild \
            -project ios/BringUp/TH08BringUp.xcodeproj \
            -scheme TH08BringUp \
            -sdk iphonesimulator \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Ensure an iPhone Simulator runtime is available
        run: |
          if ! xcrun simctl list devices available | grep -q 'iPhone'; then
            xcodebuild -downloadPlatform iOS
          fi
          xcrun simctl list devices available
      - name: Run OpenGL ES renderer tests on an iPhone Simulator
        run: |
          DEVICE_ID="$(python3 - <<'PY'
          import json
          import subprocess
          data = json.loads(subprocess.check_output(
              ["xcrun", "simctl", "list", "devices", "available", "--json"],
              text=True,
          ))
          devices = [
              device
              for runtime_devices in data["devices"].values()
              for device in runtime_devices
              if device.get("isAvailable") and device.get("name", "").startswith("iPhone")
          ]
          if not devices:
              raise SystemExit("No available iPhone simulator after installing the iOS runtime.")
          # Prefer a Plus-sized simulator as the closest available display-class
          # proxy for the target iPhone 14 Plus; otherwise use any available iPhone.
          devices.sort(key=lambda device: (
              "Plus" not in device.get("name", ""),
              device.get("name", ""),
          ))
          print(devices[0]["udid"])
          print(f"Selected simulator: {devices[0]['name']}", file=__import__("sys").stderr)
          PY
          )"
          xcodebuild \
            -project ios/BringUp/TH08BringUp.xcodeproj \
            -scheme TH08BringUp \
            -destination "platform=iOS Simulator,id=$DEVICE_ID" \
            -destination-timeout 90 \
            -parallel-testing-enabled NO \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            test
      - name: Build unsigned iOS device app
        run: |
          xcodebuild \
            -project ios/BringUp/TH08BringUp.xcodeproj \
            -scheme TH08BringUp \
            -sdk iphoneos \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            build
