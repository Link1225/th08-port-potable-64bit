name: iOS bring-up

concurrency:
  group: ios-bring-up-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches:
      - port/portable-64bit
    paths:
      - "ios/BringUp/**"
      - "ios/Tests/**"
      - "ios/README.md"
      - "ios/RENDERER_PORT.md"
      - "src/Global.cpp"
      - "src/Supervisor.cpp"
      - ".github/workflows/ios-bringup.yml"

jobs:
  pbg-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test PBG archive parser
        run: |
          swiftc ios/BringUp/TH08BringUp/TH08DataArchiveImport.swift ios/Tests/PBGArchiveImportTests.swift -o /tmp/th08-pbg-import-tests
          /tmp/th08-pbg-import-tests
          swiftc ios/BringUp/TH08BringUp/TH08IOSKeyboardKeyMapping.swift ios/Tests/KeyboardMappingTests.swift -o /tmp/th08-ios-key-mapping-tests
          /tmp/th08-ios-key-mapping-tests

  simulator-build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Test keyboard state bridge
        run: |
          clang++ -std=c++17 -x objective-c++ ios/BringUp/TH08BringUp/TH08IOSKeyboard.mm ios/Tests/KeyboardBridgeTests.cpp -o /tmp/th08-ios-keyboard-tests
          /tmp/th08-ios-keyboard-tests
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        working-directory: ios/BringUp
        run: xcodegen generate
      - name: Build iOS Simulator app
        run: |
          xcodebuild \
            -project ios/BringUp/TH08BringUp.xcodeproj \
            -scheme TH08BringUp \
            -sdk iphonesimulator \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Run OpenGL ES renderer tests
        run: |
          xcodebuild \
            -project ios/BringUp/TH08BringUp.xcodeproj \
            -scheme TH08BringUp \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            test
      - name: Build unsigned iOS device app
        run: |
          xcodebuild \
            -project ios/BringUp/TH08BringUp.xcodeproj \
            -scheme TH08BringUp \
            -sdk iphoneos \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            build
